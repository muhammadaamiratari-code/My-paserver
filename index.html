!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- مکمل سفید چاٹ ونڈو -->
    <div id="chat-container"></div>

    <!-- نیچے دیا گیا ان پٹ بار -->
    <div id="input-container">
        <!-- پلس / ضرب بٹن -->
        <button id="plus-btn" onclick="handlePlusClick()">+</button>
        <!-- صرف تصاویر کے لیے اپلوڈ ان پٹ -->
        <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelected(event)">

        <!-- ٹیکسٹ ان پٹ -->
        <input type="text" id="user-input" placeholder="یہاں لکھیں یا بولیں..." onkeydown="checkEnter(event)">

        <!-- وائس ریکارڈنگ بٹن -->
        <button id="mic-btn" onclick="toggleSpeech()">🎙️</button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
