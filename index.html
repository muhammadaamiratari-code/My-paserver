<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>My AI Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         AUTHENTICATION / FIRST SCREEN
         ========================================================= -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-card">

            <h1>My AI Hub</h1>

            <p class="auth-subtitle">
                محفوظ ذاتی معاون
            </p>

            <div id="authMessage"
                 class="auth-message"
                 aria-live="polite">
            </div>


            <!-- =================================================
                 LOGIN PANEL
                 ================================================= -->

            <section id="loginPanel" class="auth-panel">

                <h2>Login</h2>

                <label for="loginEmail">
                    Gmail
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    placeholder="آپ کی Gmail"
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="آپ کا پاس ورڈ"
                >


                <button
                    id="loginBtn"
                    class="primary-btn"
                    type="button"
                >
                    Login
                </button>


                <button
                    id="biometricLoginBtn"
                    class="secondary-btn hidden"
                    type="button"
                >
                    Face / Fingerprint سے تصدیق
                </button>


                <button
                    id="registerLink"
                    class="text-btn"
                    type="button"
                >
                    نیا اکاؤنٹ بنائیں
                </button>

            </section>


            <!-- =================================================
                 REGISTER PANEL
                 ================================================= -->

            <section
                id="registerPanel"
                class="auth-panel hidden"
            >

                <h2>
                    نیا اکاؤنٹ
                </h2>


                <label for="registerEmail">
                    Gmail
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="آپ کی Gmail"
                >


                <label for="registerPassword">
                    نیا Password
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="کم از کم 8 حروف"
                >


                <label for="registerPassword2">
                    Password دوبارہ
                </label>

                <input
                    id="registerPassword2"
                    type="password"
                    autocomplete="new-password"
                    placeholder="پاس ورڈ دوبارہ لکھیں"
                >


                <button
                    id="registerBtn"
                    class="primary-btn"
                    type="button"
                >
                    اکاؤنٹ بنائیں
                </button>


                <button
                    id="biometricSetupBtn"
                    class="secondary-btn hidden"
                    type="button"
                >
                    Face / Fingerprint سیٹ کریں
                </button>


                <button
                    id="backToLoginBtn"
                    class="text-btn"
                    type="button"
                >
                    واپس Login
                </button>

            </section>


            <!-- =================================================
                 EMERGENCY ENTRY
                 ================================================= -->

            <section class="emergency-entry">

                <button
                    id="emergencyBtn"
                    class="emergency-btn"
                    type="button"
                >
                    Emergency Command
                </button>

            </section>


            <!-- =================================================
                 EMERGENCY COMMAND PANEL
                 ================================================= -->

            <section
                id="emergencyPanel"
                class="auth-panel hidden"
            >

                <h2>
                    Emergency Command
                </h2>

                <p class="warning">
                    یہ صرف مجاز مالک کے لیے ہے۔
                    ہر Emergency Code صرف ایک مرتبہ استعمال ہوگا۔
                </p>


                <label for="emergencyEmail">
                    Gmail
                </label>

                <input
                    id="emergencyEmail"
                    type="email"
                    autocomplete="username"
                    placeholder="مالک کی Gmail"
                >


                <label for="emergencyPassword">
                    Password
                </label>

                <input
                    id="emergencyPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="مالک کا پاس ورڈ"
                >


                <button
                    id="emergencyVerifyIdentityBtn"
                    class="primary-btn"
                    type="button"
                >
                    شناخت کی تصدیق
                </button>


                <!-- ---------------------------------------------
                     EMERGENCY CODE STEP
                     --------------------------------------------- -->

                <div
                    id="emergencyCodeStep"
                    class="hidden"
                >

                    <label for="emergencyCode">
                        One-Time Emergency Code
                    </label>

                    <input
                        id="emergencyCode"
                        type="text"
                        inputmode="numeric"
                        maxlength="32"
                        placeholder="Emergency Code"
                    >


                    <label for="emergencyCommand">
                        Command
                    </label>

                    <input
                        id="emergencyCommand"
                        type="text"
                        placeholder="مثلاً: مجھے یہ محفوظ فائل چاہیے"
                    >


                    <button
                        id="emergencyExecuteBtn"
                        class="emergency-btn"
                        type="button"
                    >
                        Command Execute کریں
                    </button>

                </div>


                <button
                    id="closeEmergencyBtn"
                    class="text-btn"
                    type="button"
                >
                    واپس
                </button>

            </section>

        </div>

    </div>



    <!-- =========================================================
         MAIN APPLICATION
         ========================================================= -->

    <div
        id="appShell"
        class="app hidden"
    >


        <!-- =====================================================
             TOP HEADER
             ===================================================== -->

        <header class="top">

            <button
                class="iconbtn"
                id="mainMenuBtn"
                aria-label="Main Menu"
                type="button"
            >
                ☰
            </button>


            <span class="brand-title">
                My AI Hub
            </span>


            <div class="top-actions">

                <button
                    class="iconbtn"
                    id="newChatBtn"
                    aria-label="New Chat"
                    type="button"
                >
                    ＋
                </button>


                <button
                    class="iconbtn"
                    id="moreBtn"
                    aria-label="More Options"
                    type="button"
                >
                    ⋮
                </button>

            </div>

        </header>



        <!-- =====================================================
             CHAT AREA
             ===================================================== -->

        <main
            class="chat"
            id="chatArea"
            aria-live="polite"
        >
        </main>



        <!-- =====================================================
             VOICE WAVE
             ===================================================== -->

        <div
            id="wave"
            class="wave-visualizer"
            aria-hidden="true"
        >
        </div>



        <!-- =====================================================
             BOTTOM COMPOSER
             ===================================================== -->

        <footer class="bottom">

            <div class="composer">


                <!-- PLUS / CANCEL -->

                <button
                    class="plus-cancel-btn"
                    id="plusButton"
                    aria-label="Open Attachments"
                    type="button"
                >
                    +
                </button>


                <!-- MESSAGE INPUT -->

                <input
                    type="text"
                    id="messageInput"
                    class="text-input"
                    placeholder="کوئی پیغام لکھیں..."
                    autocomplete="off"
                >


                <!-- MICROPHONE -->

                <button
                    class="composer-btn"
                    id="micButton"
                    aria-label="Voice Record"
                    type="button"
                >
                    🎙
                </button>


                <!-- LIVE CALL -->

                <button
                    class="composer-btn"
                    id="liveButton"
                    aria-label="Live Call"
                    type="button"
                >
                    ☎
                </button>


                <!-- SEND -->

                <button
                    class="send-btn"
                    id="sendButton"
                    aria-label="Send Message"
                    type="button"
                >
                    ➤
                </button>

            </div>

        </footer>

    </div>



    <!-- =========================================================
         ATTACHMENT MENU
         ========================================================= -->

    <div
        id="attachmentMenu"
        class="attachment-menu"
    >

        <button
            type="button"
            data-attachment="file"
        >
            📄 فائل
        </button>


        <button
            type="button"
            data-attachment="image"
        >
            🖼 تصویر
        </button>


        <button
            type="button"
            data-attachment="camera"
        >
            📷 کیمرہ
        </button>

    </div>



    <!-- =========================================================
         HIDDEN FILE INPUTS
         ========================================================= -->

    <input
        id="filePicker"
        type="file"
        hidden
    >


    <input
        id="imagePicker"
        type="file"
        accept="image/*"
        hidden
    >


    <input
        id="cameraPicker"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
    >



    <!-- =========================================================
         THREE DOT MENU
         ========================================================= -->

    <div
        id="moreMenu"
        class="more-menu"
    >

        <button
            class="more-item"
            data-action="settings"
            type="button"
        >
            Settings & Security
        </button>


        <button
            class="more-item"
            data-action="live-3d-review"
            type="button"
        >
            Live 3D Hub Review
        </button>


        <button
            class="more-item"
            data-action="emergency"
            type="button"
        >
            Emergency Command
        </button>


        <button
            class="more-item"
            data-action="logout"
            type="button"
        >
            Logout
        </button>

    </div>



    <!-- =========================================================
         BACKDROP
         ========================================================= -->

    <div
        id="moreBackdrop"
        class="more-backdrop"
    >
    </div>



    <!-- =========================================================
         MODAL / PAGE LAYER
         ========================================================= -->

    <div
        id="pageLayer"
        class="page-layer"
    >
    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script
        src="script.js"
        defer
    ></script>

</body>
</html>
